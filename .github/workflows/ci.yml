name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for the same workflow+ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-matrix:
    name: CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      # Fail immediately if any matrix job fails so we don't waste runner time.
      fail-fast: true
      matrix:
        # Only Node 22 is required now, but the matrix makes it trivial to add Node 20 later.
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          # Pin the exact pnpm version declared in packageManager so the CI environment matches local dev.
          version: 10.29.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # Caches the pnpm global store, not node_modules, which keeps restore fast and safe.
          cache: "pnpm"

      - name: Install dependencies
        # --frozen-lockfile fails the build if pnpm-lock.yaml is out of sync with package.json.
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        # Prisma Client must be generated before any step that imports @prisma/client (typecheck, test, build).
        run: pnpm --filter @repo/server prisma generate

      - name: Check formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type checking
        run: pnpm typecheck

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Build project
        run: pnpm build

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        # Only upload artifacts from one matrix node to avoid redundant uploads.
        if: matrix.node-version == 22
        with:
          name: coverage-report
          path: |
            apps/server/coverage/
          # Keep artifacts for 14 days; long enough for PR review but avoids indefinite storage growth.
          retention-days: 14

  # This job exists solely to expose a single, stable status check named "CI" that branch protection can require.
  # Without it, the matrix job name would change when additional Node versions are added.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: ci-matrix
    if: always()
    steps:
      - name: Fail if matrix failed
        if: needs.ci-matrix.result != 'success'
        run: |
          echo "::error::One or more ci-matrix steps failed (install/lint/typecheck/test/build). Check the 'CI (Node 22)' job logs."
          exit 1
      - name: CI passed
        if: needs.ci-matrix.result == 'success'
        run: echo "All CI checks passed"
