name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Run a full security scan weekly (Monday at 00:00 UTC) in addition to PR/push triggers.
  schedule:
    - cron: "0 0 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Minimal permissions: only what CodeQL needs to write security findings back to the repo.
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      # Do not fail-fast so that if one language analysis fails, others still complete.
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.8
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.8
