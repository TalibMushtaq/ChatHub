<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ChatHubby — Chats</title>
<meta name="description" content="ChatHubby — your chat app.">
<script>(function(){try{var t=localStorage.getItem('ch-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 6c-15 0-26 10-26 23 0 7 3.6 13 9.5 17L12 52l12-5.3c2.6.8 5.3 1.3 8 1.3 15 0 26-10 26-23S47 6 32 6z' fill='%2322b573'/%3E%3Ccircle cx='26' cy='28' r='3' fill='%231d2b24'/%3E%3Ccircle cx='38' cy='28' r='3' fill='%231d2b24'/%3E%3Cpath d='M27 37c3 3 7 3 10 0' stroke='%231d2b24' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(0.975 0.006 92);--surface:oklch(0.997 0.003 92);--surface-2:oklch(0.948 0.008 96);
  --fg:oklch(0.26 0.014 155);--muted:oklch(0.44 0.016 155);
  --border:color-mix(in oklab,var(--fg) 14%,transparent);--border-strong:color-mix(in oklab,var(--fg) 26%,transparent);
  --accent:oklch(0.72 0.17 152);--accent-solid:oklch(0.48 0.13 152);--accent-btn:oklch(0.55 0.15 152);--accent-hover:oklch(0.50 0.15 152);
  --accent-soft:oklch(0.93 0.055 155);--accent-on:oklch(0.997 0 0);--lime:oklch(0.85 0.18 128);
  --danger:oklch(0.57 0.16 25);--success:oklch(0.62 0.15 150);
  --ring:0 0 0 3px color-mix(in oklab,var(--accent) 45%,transparent);
  --shadow-sm:0 1px 2px oklch(0 0 0 / 0.05),0 0 0 1px var(--border);
  --shadow-lg:0 26px 60px oklch(0 0 0 / 0.12);
  --font-display:"Quicksand","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-body:"Nunito","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);color-scheme:light;
}
html[data-theme="dark"]{
  --bg:oklch(0.205 0.012 168);--surface:oklch(0.245 0.013 168);--surface-2:oklch(0.285 0.014 168);
  --fg:oklch(0.93 0.008 168);--muted:oklch(0.78 0.015 168);
  --border:color-mix(in oklab,var(--fg) 15%,transparent);--border-strong:color-mix(in oklab,var(--fg) 30%,transparent);
  --accent:oklch(0.76 0.17 152);--accent-solid:oklch(0.82 0.15 152);--accent-btn:oklch(0.55 0.15 152);--accent-hover:oklch(0.50 0.15 152);
  --accent-soft:oklch(0.30 0.05 155);--danger:oklch(0.74 0.17 25);
  --shadow-sm:0 1px 2px oklch(0 0 0 / 0.4),0 0 0 1px var(--border);--shadow-lg:0 26px 60px oklch(0 0 0 / 0.55);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%}
body{font-family:var(--font-body);font-size:16px;line-height:1.5;color:var(--fg);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--font-display);letter-spacing:-0.02em;line-height:1.15}
button{font:inherit;cursor:pointer;background:none;border:0;color:inherit}
input,textarea{font:inherit;color:inherit}
a{color:var(--accent-solid);text-decoration:none}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:8px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:color-mix(in oklab,var(--fg) 18%,transparent);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:color-mix(in oklab,var(--fg) 30%,transparent)}

.shell{display:grid;grid-template-columns:76px 330px 1fr;height:100vh;height:100dvh}

.rail{display:flex;flex-direction:column;align-items:center;padding:16px 0 12px;border-right:1px solid var(--border);background:var(--surface)}
.rail .logo{display:flex;align-items:center;justify-content:center}
.rail .logo .mascot{width:38px;height:38px}
.rail .nav{flex:1;display:flex;flex-direction:column;gap:8px;width:100%;padding:22px 10px}
.nav-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;border-radius:14px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:0.02em;transition:color .15s var(--ease),background-color .15s var(--ease)}
.nav-item svg{width:21px;height:21px}
.nav-item:hover{color:var(--fg);background:var(--surface-2)}
.nav-item.on{color:var(--accent-solid);background:var(--accent-soft)}
.nav-item .nab{position:absolute;top:3px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--danger);color:oklch(0.997 0 0);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.rail .me{display:flex;flex-direction:column;align-items:center;gap:6px}
.rail .me .icon-btn{width:34px;height:34px;color:var(--muted)}
.rail .me .icon-btn:hover{color:var(--danger);background:var(--surface-2)}

.list{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border);background:var(--surface)}
.list-head{padding:18px 14px 12px}
.list-head .lrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.list-head h1{font-size:21px}
.list-head .lrow .icon-btn{width:36px;height:36px;color:var(--muted)}
.list-head .lrow .icon-btn:hover{color:var(--accent-solid);background:var(--accent-soft)}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:9px 12px;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.searchbox:focus-within{border-color:var(--accent-solid);box-shadow:var(--ring)}
.searchbox svg{width:17px;height:17px;color:var(--muted);flex:none}
.searchbox input{flex:1;min-width:0;border:0;background:none;font-size:14.5px}
.searchbox input:focus{outline:none}
.list-body{flex:1;overflow-y:auto;padding:4px 8px 16px}
.conv{display:flex;gap:11px;align-items:center;padding:10px 10px;border-radius:14px;cursor:pointer;transition:background-color .15s var(--ease)}
.conv:hover{background:var(--surface-2)}
.conv.on{background:var(--accent-soft)}
.conv .avatar{width:44px;height:44px;flex:none}
.conv .mid{flex:1;min-width:0}
.conv .line1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.conv .name{font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .time{font-size:11px;color:var(--muted);flex:none;font-weight:600}
.conv .line2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.conv .preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .unread{flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent-btn);color:var(--accent-on);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.empty-list{padding:42px 24px;text-align:center;color:var(--muted);font-size:14px}
.empty-list .mascot{width:74px;height:74px;margin:0 auto 14px;display:block}
.empty-list b{color:var(--fg);display:block;margin-bottom:4px}

.skel{height:58px;border-radius:14px;background:var(--surface-2);margin:4px 2px;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in oklab,var(--fg) 7%,transparent),transparent);animation:shimmer 1.3s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}

.thread{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.thread-head{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);background:var(--surface)}
.thread-head .icon-btn{width:40px;height:40px;color:var(--muted);flex:none}
.thread-head .icon-btn:hover{color:var(--fg);background:var(--surface-2)}
.thread-head .avatar{width:40px;height:40px;flex:none}
.thread-head .titles{flex:1;min-width:0}
.thread-head .name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread-head .sub{font-size:12.5px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.msgs-inner{width:100%;max-width:860px;margin:0 auto;padding:16px 16px 8px}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0 14px;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.msg-row{display:flex;gap:9px;margin:2px 0;align-items:flex-end;animation:pop .16s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg-row.me{justify-content:flex-end}
.msg-row .avatar{width:30px;height:30px;flex:none;font-size:11px;margin-bottom:2px}
.msg-row .col{display:flex;flex-direction:column;max-width:min(74%,560px);min-width:0}
.msg-row.me .col{align-items:flex-end}
.msg-row .meta{display:flex;gap:7px;align-items:baseline;font-size:11px;color:var(--muted);margin:0 5px 3px;font-weight:700}
.msg-row.me .meta{justify-content:flex-end}
.msg-row .meta .who{font-weight:800;color:var(--fg)}
.msg-row .meta .edited{opacity:.85}
.bubble{position:relative;padding:9px 13px;border-radius:18px;border-bottom-left-radius:6px;font-size:14.5px;line-height:1.45;white-space:normal;word-wrap:break-word;background:var(--surface-2);border:1px solid var(--border);overflow-wrap:anywhere}
.msg-row.me .bubble{background:var(--accent-btn);border-color:transparent;color:var(--accent-on);border-bottom-left-radius:18px;border-bottom-right-radius:6px}
.bubble.deleted{font-style:italic;opacity:.7;color:var(--muted)}
.bubble.pending{border-style:dashed;opacity:.75}
.bubble.failed{border-color:color-mix(in oklab,var(--danger) 55%,transparent);background:color-mix(in oklab,var(--danger) 9%,transparent)}
.msg-row .menu-btn{opacity:0;flex:none;width:28px;height:28px;color:var(--muted);align-self:center;transition:opacity .12s var(--ease)}
.msg-row.me .menu-btn{opacity:1}
.msg-row:hover .menu-btn{opacity:1}
.at{margin-top:8px;display:flex;gap:10px;align-items:center;background:color-mix(in oklab,var(--fg) 6%,transparent);border:1px solid var(--border);border-radius:12px;padding:8px 10px;min-width:220px;max-width:300px}
.msg-row.me .at{background:color-mix(in oklab,oklch(0.997 0 0) 12%,transparent);border-color:transparent}
.at .at-thumb{width:38px;height:38px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--lime),var(--accent));color:oklch(0.24 0.03 150)}
.at .at-thumb svg{width:20px;height:20px}
.at .at-meta{min-width:0}
.at .at-name{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.at .at-size{font-size:11px;opacity:.8;font-weight:600}
.edit-box{margin:4px 0;background:var(--surface-2);border:1px solid var(--accent-solid);border-radius:16px;padding:10px;max-width:min(74%,560px)}
.edit-box textarea{width:100%;background:none;border:0;resize:none;font-size:14.5px;line-height:1.45;min-height:44px;max-height:180px}
.edit-box textarea:focus{outline:none}
.edit-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.edit-actions button{font-size:13px;font-weight:800;padding:7px 14px;border-radius:99px}
.edit-actions .cancel{color:var(--muted)}
.edit-actions .save{background:var(--accent-btn);color:var(--accent-on)}
.empty-thread{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:14.5px;padding:30px}
.empty-thread .mascot{width:96px;height:96px;margin-bottom:16px}
.empty-thread b{color:var(--fg);font-size:17px;display:block;margin-bottom:4px}
.empty-thread-msg{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;padding:20px}

.composer{border-top:1px solid var(--border);background:var(--surface);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.upchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.upchip{display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:7px 10px;max-width:100%;position:relative;overflow:hidden}
.upchip .nm{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.upchip .sz{font-size:11px;color:var(--muted);font-weight:600}
.upchip .x{color:var(--muted);flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.upchip .x:hover{color:var(--danger);background:var(--surface-2)}
.upchip .pg{position:absolute;left:0;bottom:0;height:2px;background:var(--accent-btn);transition:width .15s linear}
.composer-row{display:flex;align-items:flex-end;gap:10px}
.composer textarea{flex:1;min-width:0;resize:none;background:var(--bg);border:1.5px solid var(--border);border-radius:20px;padding:11px 15px;font-size:15px;line-height:1.4;max-height:150px;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.composer textarea:focus{outline:none;border-color:var(--accent-solid);box-shadow:var(--ring)}
.composer .c-btn{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:color .15s var(--ease),background-color .15s var(--ease)}
.composer .c-btn:hover{color:var(--accent-solid);background:var(--accent-soft)}
.composer .send{background:var(--accent-btn);color:var(--accent-on)}
.composer .send:hover{background:var(--accent-hover);color:var(--accent-on)}
.composer .send:disabled{opacity:.45;cursor:default}
.composer .send svg{width:20px;height:20px}

.avatar{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:oklch(0.997 0 0);letter-spacing:0.01em;background:linear-gradient(135deg,hsl(var(--h) 62% 52%),hsl(calc(var(--h) + 42) 60% 42%));box-shadow:inset 0 0 0 1px color-mix(in oklab,oklch(0 0 0) 14%,transparent);flex:none}

.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:0.02em}
.chip.owner{background:color-mix(in oklab,var(--accent) 16%,transparent);color:var(--accent-solid)}
.chip.admin{background:color-mix(in oklab,oklch(0.70 0.15 265) 14%,transparent);color:oklch(0.55 0.14 265)}
.chip.member{background:color-mix(in oklab,var(--fg) 9%,transparent);color:var(--muted)}
.chip.pending{background:color-mix(in oklab,oklch(0.70 0.12 75) 16%,transparent);color:oklch(0.62 0.11 75)}
.chip.ok{background:color-mix(in oklab,var(--success) 15%,transparent);color:var(--success)}
.chip.dead{background:color-mix(in oklab,var(--danger) 14%,transparent);color:var(--danger)}

.bottomnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--border);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bottomnav .bn-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bottomnav .bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:12px;color:var(--muted);font-size:10.5px;font-weight:800;position:relative}
.bottomnav .bn-item svg{width:21px;height:21px}
.bottomnav .bn-item.on{color:var(--accent-solid);background:var(--accent-soft)}
.bottomnav .bn-item .nab{position:absolute;top:0;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--danger);color:oklch(0.997 0 0);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}

.modal-root{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center}
.modal-root.on{display:flex}
.modal-back{position:absolute;inset:0;background:oklch(0 0 0 / 0.42);animation:fade .2s var(--ease)}
.modal{position:relative;width:min(480px,100%);max-height:88dvh;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:rise .24s var(--ease);overflow:hidden}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-head .icon-btn{width:34px;height:34px;color:var(--muted);flex:none}
.modal-head .icon-btn:hover{color:var(--fg);background:var(--surface-2)}
.modal-body{padding:16px 18px 22px;overflow-y:auto}
.mfield{margin-bottom:14px}
.mfield label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.mfield input,.mfield textarea{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:11px 13px;font-size:14.5px;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.mfield input:focus,.mfield textarea:focus{outline:none;border-color:var(--accent-solid);box-shadow:var(--ring)}
.mfield textarea{resize:vertical;min-height:70px}
.row-item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border)}
.row-item:last-child{border-bottom:0}
.row-item .avatar{width:38px;height:38px}
.row-item .grow{flex:1;min-width:0}
.row-item .t1{font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:10px 18px;border-radius:99px;font-weight:800;font-size:14px;letter-spacing:0.02em;transition:background-color .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease),opacity .15s var(--ease)}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--accent-btn);color:var(--accent-on)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:disabled{opacity:.55;cursor:default}
.btn-ghost{background:transparent;color:var(--fg);border:1.5px solid var(--border-strong)}
.btn-ghost:hover{border-color:var(--accent-solid);color:var(--accent-solid)}
.btn-danger{background:color-mix(in oklab,var(--danger) 12%,transparent);color:var(--danger)}
.btn-danger:hover{background:color-mix(in oklab,var(--danger) 20%,transparent)}
.btn-sm{min-height:32px;padding:5px 13px;font-size:12.5px}
.btn-block{width:100%}
.mactions{display:grid;gap:10px;margin-top:16px}
.codes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.code{font-family:"gg mono",Consolas,monospace;font-size:11.5px;background:var(--accent-soft);color:var(--accent-solid);border-radius:9px;padding:9px 10px;font-weight:700;user-select:all;overflow:hidden;text-overflow:ellipsis}
.warn{display:flex;gap:10px;background:color-mix(in oklab,oklch(0.76 0.13 75) 14%,transparent);border:1px solid color-mix(in oklab,oklch(0.76 0.13 75) 35%,transparent);border-radius:10px;padding:11px 13px;font-size:13.5px;font-weight:600;margin:14px 0}
.warn svg{width:18px;height:18px;flex:none;color:oklch(0.70 0.12 75);margin-top:1px}
.mlink{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:10px 0}
.mlink .token{font-family:"gg mono",Consolas,monospace;font-size:13px;font-weight:700;color:var(--accent-solid);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all}
.linkrow-pill{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:8px}
.role-note{font-size:12.5px;color:var(--muted);margin:6px 0 2px}

.fmenu{position:fixed;z-index:90;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;min-width:190px;animation:pop .13s var(--ease)}

function msgRow(m) {

  var u = m.User || H.userById(m.senderId);
  var isEdit = S.editingId === m.id;
  var bubbleCls = "bubble";

  else if (m._failed) bubbleCls += " failed";
  else if (m._pending) bubbleCls += " pending";

    + '<span class="time">' + H.fmtTime(m.createdAt) + "</span>"

    + (m._failed ? '<button class="retry" data-retry="' + esc(m.id) + '" aria-label="Retry send" style="display:inline-flex;align-items:center;color:var(--danger)">' + IC.refresh + "</button>" : "")
    + "</div>";

  } else {

  return '<div class="msg-row' + (me ? " me" : "") + '" data-mid="' + esc(m.id) + '">'

function bubbleContent(m) {
  if (m.isDeleted) return "Message deleted";
  var parts = [];
  if (m.content) parts.push(esc(m.content).replace(/\n/g, "<br>"));
  if (m._failed) parts.push('<span style="font-size:12px;opacity:.8">Tap ↻ to retry</span>');
  (m.attachments || []).forEach(function (a) {
    parts.push('<div class="at"><div class="at-thumb">' + iconFor(a.mimeType) + '</div><div class="at-meta"><div class="at-name">' + esc(a.filename) + '</div><div class="at-size">' + H.fmtBytes(a.size) + "</div></div></div>");
  });
  return parts.join("");
}

function markRead(kind, id) {
  var list = S.msgs[keyOf({ kind: kind, id: id })] || [];
  var last = list[list.length - 1];
  if (!last) return;
  if (kind === "dm") CHAPI.markDmRead(id, last.id, S.csrf).then(function () { clearUnread("dm", id); }).catch(function () { });
  else CHAPI.markRoomRead(id, last.id, S.csrf).then(function () { clearUnread("room", id); }).catch(function () { });
}
function clearUnread(kind, id) {
  var list = kind === "dm" ? S.listDm : S.listRoom;
  var changed = false;
  for (var i = 0; i < list.length; i++) {
    if ((kind === "dm" && list[i].directChatId === id) || (kind === "room" && list[i].roomId === id)) {
      if (list[i].unreadCount) { list[i].unreadCount = 0; changed = true; }
    }
  }
  if (!changed) return;
  if (kind === "dm") S.unreadDm = S.listDm.reduce(function (a, c) { return a + (c.unreadCount || 0); }, 0);
  else S.unreadRoom = S.listRoom.reduce(function (a, c) { return a + (c.unreadCount || 0); }, 0);
  renderBadges();
  if (S.tab === kind) renderList();
}

function sendMessage(evt) {
  if (evt) evt.preventDefault();
  if (!S.active) return;
  var ta = $("#composerInput");
  var text = ta.value.trim();
  var ups = S.uploads.filter(function (u) { return u.done && u.attId; });
  if (!text && !ups.length) return;
  var mt = messageTypeFor(ups);
  var body = { content: text || null, messageType: mt, attachmentIds: ups.map(function (u) { return u.attId; }), idempotencyKey: rand() };
  if (S.active.kind === "room") body.chatRoomId = S.active.id;
  var temp = {
    id: "tmp-" + rand(), content: body.content, messageType: mt, senderId: S.user.id,
    createdAt: new Date().toISOString(), isDeleted: false, editedAt: null,
    attachments: ups.map(function (u) { return { filename: u.file.name, mimeType: u.file.type || "application/octet-stream", size: u.file.size }; }),
    User: S.user, _pending: true, _payload: body
  };
  msgsOf(S.active).push(temp);
  S.editingId = null;
  ta.value = ""; autosize();
  S.uploads = []; renderChips();
  updateSend();
  renderMsgs(true);
  if (S.active.kind === "dm") {
    CHAPI.sendDmMessage(S.active.id, body, S.csrf).then(function (res) {
      if (res.ok) ackMsg(S.active, temp, res.result);
      else failMsg(S.active, temp, res.error);
    });
  } else {
    CHSOCKET.sendRoomMessage({ callback: function (res) { if (res.ok) ackMsg(S.active, temp, res.message); else failMsg(S.active, temp, res.error); }, payload: body });
  }
}
function ackMsg(c, temp, real) {
  if (!isActive(c.kind, c.id)) return;
  var list = S.msgs[keyOf(c)];
  for (var i = 0; i < list.length; i++) if (list[i].id === temp.id) list[i] = real;
  renderMsgs(true);
}
function failMsg(c, temp, err) {
  if (!isActive(c.kind, c.id)) return;
  var m = findMsg(c, temp.id);
  if (!m) return;
  m._pending = false; m._failed = true; m._error = err;
  renderMsgs(true);
  toast(err || "Couldn't send");
}
function retryMsg(m) {
  if (!m._failed || !m._payload) return;
  m._failed = false; m._pending = true;
  renderMsgs(true);
  var c = S.active;
  if (c.kind === "dm") {
    CHAPI.sendDmMessage(c.id, m._payload, S.csrf).then(function (res) {
      if (res.ok) ackMsg(c, m, res.result);
      else failMsg(c, m, res.error);
    });
  } else {
    CHSOCKET.sendRoomMessage({ callback: function (res) { if (res.ok) ackMsg(c, m, res.message); else failMsg(c, m, res.error); }, payload: m._payload });
  }
}
function messageTypeFor(ups) {
  if (!ups.length) return "TEXT";
  for (var i = 0; i < ups.length; i++) if (ups[i].file.type && ups[i].file.type.indexOf("image/") === 0) return "IMAGE";
  for (var j = 0; j < ups.length; j++) if (ups[j].file.type && ups[j].file.type.indexOf("video/") === 0) return "VIDEO";
  for (var k = 0; k < ups.length; k++) if (ups[k].file.type && ups[k].file.type.indexOf("audio/") === 0) return "AUDIO";
  return "FILE";
}
function autosize() {
  var ta = $("#composerInput");
  ta.style.height = "auto";
  ta.style.height = Math.min(ta.scrollHeight, 150) + "px";
  updateSend();
}
function updateSend() {
  var ta = $("#composerInput");
  var has = ta.value.trim() || S.uploads.some(function (u) { return u.done; });
  $("#sendBtn").disabled = !has;
}
function renderChips() {
  var box = $("#upchips");
  if (!S.uploads.length) { box.innerHTML = ""; return; }
  box.innerHTML = S.uploads.map(function (u) {
    var pg = u.done ? 100 : u.pct;
    return '<span class="upchip"><span class="nm">' + esc(u.file.name) + '</span><span class="sz">' + H.fmtBytes(u.file.size) + (u.done ? "" : " · " + Math.round(pg) + "%") + '</span>'
      + '<button type="button" class="x" data-up="' + esc(u.id) + '" aria-label="Remove">' + IC.close + "</button>"
      + '<span class="pg" style="width:' + pg + '%"></span></span>';
  }).join("");
}
function removeUpload(id) {
  var up = null;
  for (var i = 0; i < S.uploads.length; i++) if (S.uploads[i].id === id) up = S.uploads[i];
  if (!up) return;
  S.uploads.splice(S.uploads.indexOf(up), 1);
  renderChips(); updateSend();
}
function addFiles(files) {
  if (!S.active) return;
  Array.prototype.forEach.call(files, function (f) {
    var up = { id: "up-" + rand(), file: f, attId: null, pct: 0, done: false };
    S.uploads.push(up);
    renderChips(); updateSend();
    CHAPI.presignAttachment({
      filename: f.name, mimeType: f.type || "application/octet-stream", size: f.size,
      context: S.active.kind === "dm" ? "dm" : "chatroom", contextId: S.active.id
    }, S.csrf).then(function (res) {
      if (!res.ok) {
        toast(res.error);
        removeUpload(up.id);
        return;
      }
      up.attId = res.attachmentId;
      var iv = setInterval(function () {
        up.pct = Math.min(100, up.pct + 9 + Math.random() * 16);
        renderChips();
        if (up.pct >= 100) { clearInterval(iv); up.done = true; renderChips(); updateSend(); }
      }, 130);
    });
  });
}

/* Modals */
function openModal(name, payload) {
  mStack.push({ name: name, payload: payload || {} });
  renderModal();
  $("#modalRoot").classList.add("on");
}
function closeModal() {
  if (mStack.length) mStack.pop();
  if (mStack.length) renderModal();
  else $("#modalRoot").classList.remove("on");
}
function renderModal() {
  var top = mStack[mStack.length - 1];
  $("#mBack").hidden = mStack.length <= 1;
  var title = $("#mTitle"), body = $("#mBody");
  var n = top.name;
  if (n === "newDm") { title.textContent = "New message"; body.innerHTML = modalNewDm(); wireNewDm(); }
  else if (n === "newRoom") { title.textContent = "New room"; body.innerHTML = modalNewRoom(); wireNewRoom(); }
  else if (n === "roomInfo") { title.textContent = "Room details"; body.innerHTML = modalRoomInfo(top.payload.roomId); wireRoomInfo(top.payload.roomId); }
  else if (n === "invite") { title.textContent = "Invite people"; body.innerHTML = modalInvite(top.payload.roomId); wireInvite(top.payload.roomId); }
  else if (n === "joinRequests") { title.textContent = "Join requests"; body.innerHTML = modalJoinRequests(top.payload.roomId); wireJoinRequests(top.payload.roomId); }
  else if (n === "joinLinks") { title.textContent = "Join links"; body.innerHTML = modalJoinLinks(top.payload.roomId); wireJoinLinks(top.payload.roomId); }
  else if (n === "receivedInvites") { title.textContent = "Invitations received"; body.innerHTML = modalReceived(); wireReceived(); }
  else if (n === "sentInvites") { title.textContent = "Invitations sent"; body.innerHTML = modalSent(); wireSent(); }
  else if (n === "myLinks") { title.textContent = "My join links"; body.innerHTML = modalMyLinks(); wireMyLinks(); }
  else if (n === "profile") { title.textContent = "Profile"; body.innerHTML = '<div class="empty-list">' + mascot("smile") + "Loading…</div>"; CHAPI.getUser(top.payload.userId).then(function (res) { if (res.ok) { body.innerHTML = modalProfile(res.user); wireProfile(res.user); } }); }
  else if (n === "account") { title.textContent = "Account & security"; body.innerHTML = modalAccount(); wireAccount(); }
  else if (n === "recovery") { title.textContent = "Recovery codes"; body.innerHTML = modalRecovery(); wireRecovery(); }
  else if (n === "confirm") { title.textContent = top.payload.title || "Are you sure?"; body.innerHTML = modalConfirm(top.payload); wireConfirm(top.payload); }
}

/* Floating menu */
function closeMenu() { var m = $("#fmenu"); if (m) m.remove(); }
function showMenu(btn, items) {
  closeMenu();
  var m = document.createElement("div");
  m.id = "fmenu";
  m.className = "fmenu";
  var html = "";
  items.forEach(function (it, i) {
    html += (it.hint ? '<div class="fhint">' + esc(it.hint) + "</div>" : "")
      + '<button class="' + (it.danger ? "danger" : "") + '" data-mnu="' + i + '"' + (it.disabled ? " disabled" : "") + '>' + (it.icon ? IC[it.icon] : "") + esc(it.label) + "</button>";
  });
  m.innerHTML = html;
  document.body.appendChild(m);
  var r = btn.getBoundingClientRect();
  var left = Math.max(8, Math.min(r.left, window.innerWidth - m.offsetWidth - 8));
  var top = r.bottom + 6;
  if (top + m.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - m.offsetHeight - 6);
  m.style.left = left + "px"; m.style.top = top + "px";
  items.forEach(function (it, i) {
    var b = m.querySelector('[data-mnu="' + i + '"]');
    b.addEventListener("click", function () { closeMenu(); if (!it.disabled) it.fn(); });
  });
  setTimeout(function () { document.addEventListener("click", onDocClick, { once: true }); document.addEventListener("keydown", onMenuKey, { once: true }); }, 0);
}
function onDocClick(e) { if (!e.target.closest("#fmenu")) closeMenu(); }
function onMenuKey(e) { if (e.key === "Escape") closeMenu(); }

function openMsgMenu(btn, mid) {
  var m = findMsg(S.active, mid);
  if (!m) return;
  var now = Date.now(), created = new Date(m.createdAt).getTime();
  var age = now - created;
  var mine = m.senderId === S.user.id;
  var editable = mine && age <= 300000 && !m.isDeleted && !m._pending;
  var deletable = mine && age <= 1800000 && !m.isDeleted && !m._pending;
  var items = [
    { label: "Edit", icon: "edit", disabled: !editable, hint: (mine && age > 300000 && !m.isDeleted) ? "Editable for 5 minutes" : "", fn: function () { startEdit(m); } },
    { label: "Delete", icon: "trash", danger: true, disabled: !deletable, hint: (mine && age > 1800000 && !m.isDeleted) ? "Deletable for 30 minutes" : "", fn: function () { confirmDelete(m); } }
  ];
  showMenu(btn, items);
}
function startEdit(m) {
  S.editingId = m.id;
  renderMsgs(true);
}
function cancelEdit() { S.editingId = null; renderMsgs(true); }
function saveEdit() {
  var m = findMsg(S.active, S.editingId);
  var ta = $("#editInput");
  if (!m || !ta) return;
  var content = ta.value;
  if (!content.trim()) { toast("Message can't be empty"); return; }
  var done = function (res) {
    if (!res.ok) { toast(res.error); return; }
    m.content = content; m.editedAt = new Date().toISOString();
    S.editingId = null;
    renderMsgs(true);
  };
  if (S.active.kind === "dm") CHAPI.editDmMessage(m.id, content, S.csrf).then(done);
  else CHSOCKET.editRoomMessage({ callback: done, payload: { messageId: m.id, content: content } });
}
function confirmDelete(m) {
  openModal("confirm", {
    title: "Delete message?",
    body: "This can't be undone. The message will disappear for everyone in the chat.",
    label: "Delete",
    danger: true,
    action: function () {
      var done = function (res) {
        if (!res.ok) { toast(res.error); return; }
        m.isDeleted = true; m.content = null; m.attachments = [];
        S.editingId = null;
        renderMsgs(true);
      };
      if (S.active.kind === "dm") CHAPI.deleteDmMessage(m.id, S.csrf).then(done);
      else CHSOCKET.deleteRoomMessage({ callback: done, payload: { messageId: m.id } });
    }
  });
}

function debounce(fn, ms) { var t; return function () { clearTimeout(t); t = setTimeout(fn, ms); }; }

/* Socket events */
function onDmNew(m) {
  if (!m || !m.directChatId) return;
  if (S.active && S.active.kind === "dm" && S.active.id === m.directChatId) {
    if (!findMsg(S.active, m.id)) {
      S.msgs[keyOf(S.active)].push(m);
      renderMsgs(false);
      markRead("dm", S.active.id);
    }
  } else reloadDmSoon();
}
function onDmEdited(d) {
  var c = { kind: "dm", id: d.directChatId };
  var m = findMsg(c, d.messageId);
  if (m && S.active && S.active.kind === "dm" && S.active.id === d.directChatId) {
    if (S.editingId !== m.id) { m.content = d.content; m.editedAt = d.editedAt; renderMsgs(false); }
  } else reloadDmSoon();
}
function onDmDeleted(d) {
  var c = { kind: "dm", id: d.directChatId };
  var m = findMsg(c, d.messageId);
  if (m && S.active && S.active.kind === "dm" && S.active.id === d.directChatId) {
    m.isDeleted = true; m.content = null; m.attachments = [];
    renderMsgs(false);
  } else reloadDmSoon();
}
function onDmRead(d) { clearUnread("dm", d.directChatId); }
function onRoomRead(d) { clearUnread("room", d.chatRoomId); }
function onRoomNew(m) {
  if (!m || !m.chatRoomId) return;
  if (S.active && S.active.kind === "room" && S.active.id === m.chatRoomId) {
    if (!findMsg(S.active, m.id)) {
      S.msgs[keyOf(S.active)].push(m);
      renderMsgs(false);
      markRead("room", S.active.id);
    }
  } else loadList("room");
}
function onRoomEdited(d) {
  var c = { kind: "room", id: d.chatRoomId };
  var m = findMsg(c, d.messageId);
  if (m && S.active && S.active.kind === "room" && S.active.id === d.chatRoomId) {
    if (S.editingId !== m.id) { m.content = d.content; m.editedAt = d.editedAt; renderMsgs(false); }
  } else loadList("room");
}
function onRoomDeleted(d) {
  var c = { kind: "room", id: d.chatRoomId };
  var m = findMsg(c, d.messageId);
  if (m && S.active && S.active.kind === "room" && S.active.id === d.chatRoomId) {
    m.isDeleted = true; m.content = null; m.attachments = [];
    renderMsgs(false);
  } else loadList("room");
}
function onInboxUpdate() { reloadDmSoon(); }

function wireSockets() {
  CHSOCKET.on("message:new", onDmNew);
  CHSOCKET.on("message:edited", onDmEdited);
  CHSOCKET.on("message:deleted", onDmDeleted);
  CHSOCKET.on("directChat:read", onDmRead);
  CHSOCKET.on("chatroom:read", onRoomRead);
  CHSOCKET.on("chatroom:message", onRoomNew);
  CHSOCKET.on("chatroom:message:edited", onRoomEdited);
  CHSOCKET.on("chatroom:message:deleted", onRoomDeleted);
  CHSOCKET.on("inbox:update", onInboxUpdate);
  window.addEventListener("storage", function (e) {
    if (e.key === "chsync" && e.newValue) {
      try { var v = JSON.parse(e.newValue); CHSOCKET._emit(v.evt, v.data); } catch (err) { }
    }
  });
}

function handleOpenParam() {
  var m = (location.search || "").match(/[?&]open=([^&]+)/);
  if (!m) return;
  var val = decodeURIComponent(m[1]);
  if (val.indexOf("room:") === 0) {
    var id = val.slice(5);
    if (S.listRoom.some(function (r) { return r.roomId === id; })) openConv("room", id);
    else toast("You're not in that room yet.");
  } else if (val.indexOf("dm:") === 0) {
    openConv("dm", val.slice(3));
  }
}

function boot() {
  if (!CHAPI.currentUser()) { window.location.href = "auth.html"; return; }
  S.user = CHAPI.currentUser();
  var av = $("#meAv");
  var hue = H.hue(S.user.id);
  av.style.setProperty("--h", hue);
  av.textContent = H.initials(S.user.displayname || S.user.username);
  av.title = S.user.displayname + " @" + S.user.username;

  CHAPI.getCsrf().then(function (res) { S.csrf = res.csrfToken; });

  var em = $("#emptyThread");
  em.innerHTML = mascot("smile") + "<b>Pick a conversation</b>Choose a chat on the left to start messaging.";

  $$(".nav-item, .bn-item").forEach(function (b) {
    b.addEventListener("click", function () {
      S.tab = b.dataset.tab;
      closeThread();
      renderTab();
    });
  });
  $("#listAction").addEventListener("click", function () {
    var mname = $("#listAction").dataset.modal;
    if (mname) openModal(mname);
  });
  $("#logoutBtn").addEventListener("click", doLogout);
  $("#backBtn").addEventListener("click", closeThread);
  $("#mClose").addEventListener("click", closeModal);
  $("#mBack").addEventListener("click", closeModal);
  $("#modalBack").addEventListener("click", closeModal);

  $("#listSearch").addEventListener("input", debounce(function () {
    var v = $("#listSearch").value.trim();
    if (S.tab === "search") {
      S.q = v;
      if (v.length < 2) { renderSearchHint(); return; }
      CHAPI.searchUsers(v, 10).then(function (res) { S.results = res.users || []; renderSearchResults(); });
    } else {
      S.q = v;
      renderList();
    }
  }, 160));

  $("#listBody").addEventListener("click", function (e) {
    var open = e.target.closest("[data-open]");
    if (open) {
      var parts = open.dataset.open.split(":");
      openConv(parts[0], parts[1]);
      return;
    }
    var sd = e.target.closest("[data-startdm]");
    if (sd) startDm(sd.dataset.startdm);
  });
  $("#listBody").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      var open = e.target.closest("[data-open]");
      if (open) { var p = open.dataset.open.split(":"); openConv(p[0], p[1]); }
    }
  });

  $("#composer").addEventListener("submit", sendMessage);
  $("#composerInput").addEventListener("input", autosize);
  $("#composerInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  $("#sendBtn").addEventListener("click", function () { sendMessage(); });
  $("#attachBtn").addEventListener("click", function () { $("#fileInput").click(); });
  $("#fileInput").addEventListener("change", function () { addFiles($("#fileInput").files); $("#fileInput").value = ""; });
  $("#upchips").addEventListener("click", function (e) {
    var x = e.target.closest("[data-up]");
    if (x) removeUpload(x.dataset.up);
  });

  $("#msgs").addEventListener("click", function (e) {
    var menu = e.target.closest("[data-menu]");
    if (menu) { openMsgMenu(menu, menu.dataset.menu); return; }
    var retry = e.target.closest("[data-retry]");
    if (retry) { var rm = findMsg(S.active, retry.dataset.retry); if (rm) retryMsg(rm); return; }
    var save = e.target.closest("[data-edit-save]");
    if (save) { saveEdit(); return; }
    var cancel = e.target.closest("[data-edit-cancel]");
    if (cancel) { cancelEdit(); return; }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if ($("#fmenu")) closeMenu();
      else if (mStack.length) closeModal();
    }
  });

  wireSockets();
  renderTab();
  $("#listBody").innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  Promise.all([loadList("dm"), loadList("room")]).then(function () {
    handleOpenParam();
  });
  applyTheme(document.documentElement.getAttribute("data-theme") || "light");
}
boot();
</script>
</body>
</html>
